<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سنتر الصفا التعليمي</title>
    <style>
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 11px;
            margin-bottom: 15px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>اختبار الدخول السريع</h2>
        <p>اكتبي أي حاجة واضغطي زرار الدخول:</p>
        <input type="text" id="testInput" placeholder="اكتبي اسمك هنا">
        <button type="button" id="testBtn">اضغطي هنا للتجربة</button>
    </div>

    <script>
        const btn = document.getElementById("testBtn");
        btn.addEventListener("click", () => {
            alert("الزرار شغال وزي الفل!");
            window.location.href = "https://www.google.com";
        });
    </script>
</body>
</html>
